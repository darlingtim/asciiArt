<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASCII Art Web</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f9; }
        textarea { width: 100%; height: 100px; font-size: 16px; }
        .result { background: #222; color: #00ff00; padding: 20px; font-family: monospace; overflow-x: auto; white-space: pre; }
    </style>
</head>
<body>
    <h1>ASCII Art Generator</h1>
    
    <form action="/ascii-art" method="POST">
        <label for="text">Enter Text:</label><br>
        <textarea id="text" name="text" required>{{.Text}}</textarea><br><br>

        <label>Select Banner:</label><br>
        <input type="radio" id="standard" name="banner" value="standard" {{if eq .Banner "standard"}}checked{{end}} checked>
        <label for="standard">Standard</label>
        
        <input type="radio" id="shadow" name="banner" value="shadow" {{if eq .Banner "shadow"}}checked{{end}}>
        <label for="shadow">Shadow</label>
        
        <input type="radio" id="thinkertoy" name="banner" value="thinkertoy" {{if eq .Banner "thinkertoy"}}checked{{end}}>
        <label for="thinkertoy">Thinkertoy</label><br><br>

        <button type="submit">Generate</button>
    </form>

    {{if .AsciiResult}}
    <h2>Result:</h2>
    <div class="result">{{.AsciiResult}}</div>
    {{end}}
</body>
</html>
